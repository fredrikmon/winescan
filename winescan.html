<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WineScan test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0e0a0b;
    --fg: #f6efe8;
    --muted: #b9aaa2;
    --badge: #f6efe8;
    --badge-fg: #2a0f14;
    --wine: #8b1e3f;
    --ok: #4fbf8a;
    --font-ui: "Inter Tight", -apple-system, system-ui, Helvetica, Arial, sans-serif;
    --font-score: "Fraunces", Georgia, "Times New Roman", serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; background: #000; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: linear-gradient(rgba(14,10,11,.78), rgba(14,10,11,0));
  }
  #brand { font-family: var(--font-score); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  #status { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; max-width: 60%; }
  #status.live::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); margin-right: 6px; vertical-align: 1px;
  }

  #bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(rgba(14,10,11,0), rgba(14,10,11,.85) 40%);
  }
  #result {
    display: none; align-items: baseline; gap: 12px;
    background: var(--badge); color: var(--badge-fg);
    border-radius: 14px; padding: 12px 14px;
  }
  #result.show { display: flex; }
  #result .score { font-family: var(--font-score); font-weight: 700; font-size: 34px; line-height: 1; white-space: nowrap; }
  #result .score small { font-size: 14px; font-weight: 500; margin-right: 2px; }
  #result .name { font-weight: 600; font-size: 15px; }
  #result .note { font-size: 13px; color: #5a3a40; margin-top: 2px; line-height: 1.3; }

  #controls { display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; background: rgba(246,239,232,.12); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: var(--fg); font: 500 14px var(--font-ui);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--badge-fg); }
  .btn {
    border: 0; background: rgba(246,239,232,.12); color: var(--fg);
    font: 500 14px var(--font-ui); padding: 11px 14px; border-radius: 999px; cursor: pointer;
  }
  .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #spacer { flex: 1; }

  #debug {
    display: none; font: 11px/1.35 ui-monospace, Menlo, monospace; color: var(--muted);
    background: rgba(0,0,0,.45); border-radius: 10px; padding: 8px 10px;
    max-height: 22vh; overflow: auto; white-space: pre-wrap;
  }
  #debug.show { display: block; }

  #gate {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; justify-content: center; gap: 18px;
    padding: 28px; z-index: 10;
  }
  #gate h1 { font-family: var(--font-score); font-weight: 500; font-size: 40px; line-height: 1.02; margin: 0; letter-spacing: -0.02em; }
  #gate p { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 0; max-width: 34ch; }
  #gate .btn.primary { background: var(--fg); color: var(--badge-fg); font-size: 17px; padding: 14px 20px; align-self: flex-start; }
  #gate .err { color: #ff9f9f; }

  @media (prefers-reduced-motion: no-preference) {
    #result.show { animation: pop .18s ease-out; }
    @keyframes pop { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>

<div id="gate">
  <h1>Point the camera at a wine list or a label.</h1>
  <p>Test build. Nine Finca Sandoval wines are loaded. Text is read on your phone, nothing is uploaded.</p>
  <button id="start" class="btn primary">Start camera</button>
  <p id="gateMsg"></p>
</div>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="top">
    <div id="brand">WineScan</div>
    <div id="status">Loading…</div>
  </div>
  <div id="bottom">
    <div id="debug"></div>
    <div id="result">
      <div class="score"><small>RP</small><span id="rScore"></span></div>
      <div><div class="name" id="rName"></div><div class="note" id="rNote"></div></div>
    </div>
    <div id="controls">
      <div class="seg" role="group" aria-label="Mode">
        <button id="modeList" aria-pressed="true">Wine list</button>
        <button id="modeLabel" aria-pressed="false">Label</button>
      </div>
      <div id="spacer"></div>
      <button id="pause" class="btn">Pause</button>
      <button id="dbg" class="btn" aria-label="Show raw text">Text</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<script>
// ---------- Data (iteration 1, hardcoded). Notes are draft text, replace freely. ----------
const WINES = [
  { id:"fs24-salia", producer:"Finca Sandoval", cuvee:"Salia", vintage:2024, score:"94",  note:"Bright and juicy. Syrah led, fresh red fruit, easy to like." },
  { id:"fs24-fund",  producer:"Finca Sandoval", cuvee:"Fundamentalista", vintage:2024, score:"92+", note:"Pure Bobal. Taut, mineral, a little wild. Needs air." },
  { id:"fs24-aurora",producer:"Finca Sandoval", cuvee:"Aurora", vintage:2024, score:"93+", note:"The white. Textured, saline, built for food." },
  { id:"fs23-base",  producer:"Finca Sandoval", cuvee:"", vintage:2023, score:"95",  note:"The flagship. Deep, layered, polished tannin. Will age." },
  { id:"fs23-fund",  producer:"Finca Sandoval", cuvee:"Fundamentalista", vintage:2023, score:"93",  note:"Bobal with grip and lift. Honest, serious, unpolished." },
  { id:"fs23-aurora",producer:"Finca Sandoval", cuvee:"Aurora", vintage:2023, score:"94",  note:"Ripe but tense white. Stone fruit, chalk, long finish." },
  { id:"fs22-base",  producer:"Finca Sandoval", cuvee:"", vintage:2022, score:"95",  note:"Warm year, cool wine. Dense fruit, fine structure." },
  { id:"fs22-salia", producer:"Finca Sandoval", cuvee:"Salia", vintage:2022, score:"93+", note:"More concentration than usual Salia. Still fresh." },
  { id:"fs22-fund",  producer:"Finca Sandoval", cuvee:"Fundamentalista", vintage:2022, score:"92+", note:"Rustic edge, dark fruit, firm acidity. Drink with lamb." },
];
const CUVEES = ["salia", "fundamentalista", "aurora"];

// ---------- Matching ----------
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function tokenMatches(tok, word) {
  if (tok === word) return true;
  const tol = word.length >= 10 ? 3 : word.length >= 6 ? 2 : word.length >= 4 ? 1 : 0;
  return Math.abs(tok.length - word.length) <= tol && lev(tok, word) <= tol;
}
// OCR often misreads 0/O, 1/l, 5/S in years. Normalize before matching.
function findVintage(tokens) {
  for (const t of tokens) {
    const fixed = t.replace(/o/g, "0").replace(/[il|]/g, "1").replace(/s/g, "5").replace(/z/g, "2").replace(/b/g, "8");
    const m = fixed.match(/^(19|20)\d\d$/);
    if (m) { const y = +fixed; if (y >= 2000 && y <= 2030) return y; }
  }
  return null;
}
function extract(text) {
  const tokens = norm(text).split(" ").filter(Boolean);
  const producer = tokens.some(t => tokenMatches(t, "sandoval")) || (tokens.some(t => tokenMatches(t, "finca")) && tokens.some(t => t.length >= 6 && lev(t, "sandoval") <= 4));
  let cuvee = null;
  for (const c of CUVEES) if (tokens.some(t => tokenMatches(t, c))) { cuvee = c; break; }
  return { producer, cuvee, vintage: findVintage(tokens), tokens };
}
function pick(ex, strict) {
  if (!ex.producer) return null;
  const cuvee = ex.cuvee ? ex.cuvee : "";
  let cands = WINES.filter(w => w.cuvee.toLowerCase() === cuvee);
  if (ex.vintage) {
    const exact = cands.filter(w => w.vintage === ex.vintage);
    if (exact.length) return exact[0];
    if (strict) return null;
  }
  if (strict && !ex.vintage) return null;
  // No vintage read: show newest, flagged.
  cands.sort((a, b) => b.vintage - a.vintage);
  return cands.length ? Object.assign({}, cands[0], { approx: true }) : null;
}

// ---------- Camera and OCR ----------
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const debugEl = document.getElementById("debug");
const gate = document.getElementById("gate");
const gateMsg = document.getElementById("gateMsg");
const work = document.createElement("canvas");
const wctx = work.getContext("2d", { willReadFrequently: true });

let mode = "list", paused = false, worker = null, busy = false, raf = 0;
let sticky = new Map(); // id -> {wine, box, until}
let lastResult = { until: 0 };

function setStatus(t, live) { statusEl.textContent = t; statusEl.classList.toggle("live", !!live); }

async function initOCR() {
  setStatus("Loading text engine…");
  worker = await Tesseract.createWorker("eng", 1, {
    logger: m => { if (m.status === "loading tesseract core" || m.status === "loading language traineddata") setStatus(`Loading ${Math.round((m.progress||0)*100)}%`); }
  });
  await applyMode();
}
async function applyMode() {
  if (!worker) return;
  await worker.setParameters({
    tessedit_pageseg_mode: mode === "list" ? Tesseract.PSM.SINGLE_BLOCK : Tesseract.PSM.SPARSE_TEXT,
    preserve_interword_spaces: "1",
  });
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  const track = stream.getVideoTracks()[0];
  try { const caps = track.getCapabilities?.(); if (caps && caps.focusMode && caps.focusMode.includes("continuous")) await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch (e) {}
}

function sizeOverlay() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  overlay.width = Math.round(overlay.clientWidth * dpr);
  overlay.height = Math.round(overlay.clientHeight * dpr);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", sizeOverlay);

// Map from work-canvas coords to displayed (object-fit: cover) coords.
function coverMap() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const k = vw / work.width; // work canvas is downscaled
  return (x, y) => [ox + x * k * s, oy + y * k * s];
}

async function tick() {
  if (!paused && !busy && worker && video.videoWidth) {
    busy = true;
    try {
      const target = 1000;
      const k = Math.min(1, target / video.videoWidth);
      work.width = Math.round(video.videoWidth * k);
      work.height = Math.round(video.videoHeight * k);
      wctx.drawImage(video, 0, 0, work.width, work.height);
      // Light contrast boost helps printed lists under restaurant light.
      wctx.filter = "contrast(1.25) grayscale(1)";
      wctx.drawImage(work, 0, 0);
      wctx.filter = "none";

      const t0 = performance.now();
      const { data } = await worker.recognize(work, {}, { text: true, blocks: true });
      const ms = Math.round(performance.now() - t0);
      const lines = [];
      for (const b of data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) {
        if (l.text && l.text.trim().length >= 3) lines.push({ text: l.text.trim(), bbox: l.bbox, conf: l.confidence });
      }
      debugEl.textContent = `${ms} ms\n` + lines.map(l => `${Math.round(l.conf)}  ${l.text}`).join("\n");
      handleLines(lines, data.text || "");
      setStatus(mode === "list" ? `Scanning list · ${ms} ms` : `Scanning label · ${ms} ms`, true);
    } catch (e) {
      setStatus("Read failed: " + (e.message || e));
    } finally { busy = false; }
  }
  drawOverlay();
  raf = requestAnimationFrame(tick);
}

function handleLines(lines, fullText) {
  const now = performance.now();
  if (mode === "list") {
    // Per line, plus a two-line window so a wrapped name still matches.
    const texts = lines.map((l, i) => [l, i < lines.length - 1 ? l.text + " " + lines[i+1].text : null]);
    for (const [l, pair] of texts) {
      let w = pick(extract(l.text), true);
      if (!w && pair) w = pick(extract(pair), true);
      if (w) sticky.set(w.id + "@" + Math.round(l.bbox.y0 / 25), { wine: w, box: l.bbox, until: now + 2500 });
    }
    // Best match for the summary card
    const live = [...sticky.values()].filter(s => s.until > now);
    if (live.length) {
      const top = live.sort((a, b) => a.box.y0 - b.box.y0)[0];
      showResult(top.wine, now + 2500);
    }
  } else {
    const w = pick(extract(fullText), false);
    if (w) showResult(w, now + 3000);
  }
}

function showResult(w, until) {
  document.getElementById("rScore").textContent = w.score;
  document.getElementById("rName").textContent = `${w.vintage} ${w.producer}${w.cuvee ? " " + w.cuvee : ""}${w.approx ? " (vintage not read)" : ""}`;
  document.getElementById("rNote").textContent = w.note;
  resultEl.classList.add("show");
  lastResult.until = until;
}

function drawOverlay() {
  const now = performance.now();
  octx.clearRect(0, 0, overlay.clientWidth, overlay.clientHeight);
  if (!paused && lastResult.until && lastResult.until < now) resultEl.classList.remove("show");
  if (mode !== "list" || !video.videoWidth || !work.width) return;
  const map = coverMap();
  for (const [key, s] of sticky) {
    if (!paused && s.until < now) { sticky.delete(key); continue; }
    const [x0, y0] = map(s.box.x0, s.box.y0);
    const [x1, y1] = map(s.box.x1, s.box.y1);
    const alpha = paused ? 1 : Math.min(1, (s.until - now) / 500);
    octx.globalAlpha = alpha;
    // underline the matched line
    octx.strokeStyle = "rgba(246,239,232,.9)"; octx.lineWidth = 1.5;
    octx.beginPath(); octx.moveTo(x0, y1 + 3); octx.lineTo(x1, y1 + 3); octx.stroke();
    // score badge at the right end of the line
    const label = "RP " + s.wine.score;
    octx.font = "700 17px Fraunces, Georgia, serif";
    const tw = octx.measureText(label).width;
    const bw = tw + 18, bh = 28;
    let bx = Math.min(x1 + 10, overlay.clientWidth - bw - 10), by = (y0 + y1) / 2 - bh / 2;
    octx.fillStyle = "#f6efe8";
    roundRect(bx, by, bw, bh, 8); octx.fill();
    octx.fillStyle = "#2a0f14";
    octx.textBaseline = "middle"; octx.fillText(label, bx + 9, by + bh / 2 + 1);
    octx.globalAlpha = 1;
  }
}
function roundRect(x, y, w, h, r) {
  octx.beginPath(); octx.moveTo(x + r, y); octx.arcTo(x + w, y, x + w, y + h, r); octx.arcTo(x + w, y + h, x, y + h, r);
  octx.arcTo(x, y + h, x, y, r); octx.arcTo(x, y, x + w, y, r); octx.closePath();
}

// ---------- UI ----------
document.getElementById("start").addEventListener("click", async () => {
  gateMsg.textContent = "";
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("Camera API not available. Open this page in Safari over https.");
    await startCamera();
    gate.style.display = "none";
    sizeOverlay();
    tick();
    await initOCR();
  } catch (e) {
    gateMsg.className = "err";
    gateMsg.textContent = "Could not start: " + (e.message || e) + ". Check camera permission for this site in Settings > Safari.";
  }
});
document.getElementById("modeList").addEventListener("click", () => setMode("list"));
document.getElementById("modeLabel").addEventListener("click", () => setMode("label"));
async function setMode(m) {
  mode = m; sticky.clear(); resultEl.classList.remove("show");
  document.getElementById("modeList").setAttribute("aria-pressed", m === "list");
  document.getElementById("modeLabel").setAttribute("aria-pressed", m === "label");
  await applyMode();
}
document.getElementById("pause").addEventListener("click", e => {
  paused = !paused; e.target.textContent = paused ? "Resume" : "Pause";
  if (paused) { video.pause(); setStatus("Paused"); } else { video.play(); }
});
document.getElementById("dbg").addEventListener("click", () => debugEl.classList.toggle("show"));
</script>
</body>
</html>
