<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WineScan test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0e0a0b;
    --fg: #f6efe8;
    --muted: #b9aaa2;
    --badge: #f6efe8;
    --badge-fg: #2a0f14;
    --wine: #8b1e3f;
    --ok: #4fbf8a;
    --font-ui: "Inter Tight", -apple-system, system-ui, Helvetica, Arial, sans-serif;
    --font-score: "Fraunces", Georgia, "Times New Roman", serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; background: #000; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: linear-gradient(rgba(14,10,11,.78), rgba(14,10,11,0));
  }
  #brand { font-family: var(--font-score); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  #status { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; max-width: 60%; }
  #status.live::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); margin-right: 6px; vertical-align: 1px;
  }

  #bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(rgba(14,10,11,0), rgba(14,10,11,.85) 40%);
  }
  #result {
    display: none; gap: 12px;
    background: var(--badge); color: var(--badge-fg);
    border-radius: 14px; padding: 12px 14px;
  }
  #result.show { display: flex; }
  #result .score { font-family: var(--font-score); font-weight: 700; font-size: 30px; line-height: 1.1; white-space: nowrap; }
  #result .latest { font-size: 15px; color: #5a3a40; margin-left: 6px; }
  #result .line { margin-top: 4px; display: flex; align-items: baseline; }
  #result .name { font-weight: 500; font-size: 14px; color: #5a3a40; }
  #result .note { font-size: 13px; color: #5a3a40; margin-top: 2px; line-height: 1.3; }

  #controls { display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; background: rgba(246,239,232,.12); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: var(--fg); font: 500 14px var(--font-ui);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--badge-fg); }
  .btn {
    border: 0; background: rgba(246,239,232,.12); color: var(--fg);
    font: 500 14px var(--font-ui); padding: 11px 14px; border-radius: 999px; cursor: pointer;
  }
  .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #spacer { flex: 1; }
  .btn.scan { background: var(--fg); color: var(--badge-fg); font-weight: 600; padding: 11px 22px; min-width: 120px; }
  .btn.scan:disabled { opacity: .6; }

  #debug {
    display: none; font: 11px/1.35 ui-monospace, Menlo, monospace; color: var(--muted);
    background: rgba(0,0,0,.45); border-radius: 10px; padding: 8px 10px;
    max-height: 22vh; overflow: auto; white-space: pre-wrap;
  }
  #debug.show { display: block; }

  #gate {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; justify-content: center; gap: 18px;
    padding: 28px; z-index: 10;
  }
  #gate h1 { font-family: var(--font-score); font-weight: 500; font-size: 40px; line-height: 1.02; margin: 0; letter-spacing: -0.02em; }
  #gate p { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 0; max-width: 34ch; }
  #gate .btn.primary { background: var(--fg); color: var(--badge-fg); font-size: 17px; padding: 14px 20px; align-self: flex-start; }
  #gate .err { color: #ff9f9f; }

  #sheetBg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 20; }
  #sheetBg.show { display: block; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--badge); color: var(--badge-fg);
    border-radius: 20px 20px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translateY(105%); transition: transform .24s ease-out; max-height: 78%; overflow: auto;
  }
  #sheet.show { transform: none; }
  #sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #c9b8b0; margin: 0 auto 14px; }
  #sheet .path { font-size: 13px; color: #5a3a40; }
  #sheet h2 { font-family: var(--font-score); font-weight: 700; font-size: 28px; margin: 4px 0 0; line-height: 1.1; }
  #sheet .hero { font-family: var(--font-score); font-weight: 700; font-size: 40px; line-height: 1; margin: 10px 0 2px; }
  #sheet .hero small { font-family: var(--font-ui); font-weight: 500; font-size: 14px; color: #5a3a40; margin-left: 8px; }
  #sheet .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 14px 0; }
  #sheet .kv dt { color: #5a3a40; } #sheet .kv dd { margin: 0; font-weight: 500; }
  #sheet p { font-size: 15px; line-height: 1.45; margin: 0 0 14px; }
  #sheet h3 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #5a3a40; margin: 16px 0 6px; font-weight: 600; }
  #sheet .vint { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid #e6dcd3; font-size: 15px; }
  #sheet .vint b { font-family: var(--font-score); font-size: 17px; }
  #sheet .close { position: absolute; right: 14px; top: 12px; border: 0; background: #e6dcd3; color: #2a0f14; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  #overlay { pointer-events: auto; }
  #result { cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) {
    #result.show { animation: pop .18s ease-out; }
    @keyframes pop { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>

<div id="gate">
  <h1>Point the camera at a wine list or a label.</h1>
  <p>Test build. Frame the list, tap Scan. Finca Sandoval is in the catalog. Text is read on your phone, nothing is uploaded.</p>
  <button id="start" class="btn primary">Start camera</button>
  <p id="gateMsg"></p>
</div>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="top">
    <div id="brand">WineScan</div>
    <div id="status">Loading…</div>
  </div>
  <div id="bottom">
    <div id="debug"></div>
    <div id="result">
      <div><div class="name" id="rName"></div>
        <div class="line"><span class="score">Parker <span id="rScore"></span></span> <span class="latest" id="rLatest"></span></div>
        <div class="note" id="rNote"></div></div>
    </div>
    <div id="controls">
      <div class="seg" role="group" aria-label="Mode">
        <button id="modeList" aria-pressed="true">Wine list</button>
        <button id="modeLabel" aria-pressed="false">Label</button>
      </div>
      <div id="spacer"></div>
      <button id="scan" class="btn scan">Scan</button>
      <button id="dbg" class="btn" aria-label="Show raw text">Text</button>
    </div>
  </div>
</div>

<div id="sheetBg"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <button class="close" id="sheetClose" aria-label="Close">×</button>
  <div class="path" id="sPath"></div>
  <h2 id="sName"></h2>
  <div class="hero">Parker <span id="sScore"></span><small id="sLatest"></small></div>
  <dl class="kv"><dt>Grapes</dt><dd id="sGrapes"></dd><dt>Style</dt><dd id="sStyle"></dd></dl>
  <p id="sNotes"></p>
  <h3>Rated vintages</h3>
  <div id="sVintages"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<script>
// ---------- Catalog. Add producers and wines here; matching is data driven. ----------
// keys: words that identify the entry in OCR text. hints: other label words that prove the producer.
// A wine with no keys is the producer's base wine, used when no other wine key is found.
const CATALOG = [
  {
    country: "Spain", region: "Manchuela", producer: "Finca Sandoval",
    keys: ["sandoval", "fincasandoval"],
    hints: ["ledana", "casablanca", "suelocalcareo", "vinosconalma", "manchuela"],
    wines: [
      { name: "Finca Sandoval", keys: [], scores: { 2023: "95", 2022: "95" },
        grapes: "Syrah, Bobal", style: "Red · full bodied",
        notes: "The flagship. Old vines on limestone at 900 m. Dense dark fruit, fine tannin, long finish. Built to age ten years or more." },
      { name: "Salia", keys: ["salia"], scores: { 2024: "94", 2022: "93+" },
        grapes: "Syrah, Garnacha Tintorera, Bobal", style: "Red · medium bodied",
        notes: "The approachable red. Bright red fruit, pepper, fresh acidity. Drinks well young with grilled meat or charcuterie." },
      { name: "Fundamentalista", keys: ["fundamentalista"], scores: { 2024: "92+", 2023: "93", 2022: "92+" },
        grapes: "Bobal", style: "Red · mineral",
        notes: "Pure Bobal from old vines. Taut, savory, a little wild. Needs air or a few years. Lamb, game, aged cheese." },
      { name: "Aurora", keys: ["aurora"], scores: { 2024: "93+", 2023: "94" },
        grapes: "White blend", style: "White · textured",
        notes: "The white. Stone fruit, chalk, saline length. Serve cool but not cold. Fish, rice dishes, soft cheese." },
    ],
  },
];

// ---------- Matching ----------
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function tolFor(word) { return word.length >= 10 ? 2 : word.length >= 6 ? 1 : 0; }
function tokenMatches(tok, word) {
  if (tok === word) return true;
  const tol = word.length >= 10 ? 3 : word.length >= 6 ? 2 : word.length >= 4 ? 1 : 0;
  return Math.abs(tok.length - word.length) <= tol && lev(tok, word) <= tol;
}
// Fuzzy substring: does `word` appear inside `hay` with at most `tol` edits?
function fuzzyIn(hay, word, tol) {
  if (hay.includes(word)) return true;
  const L = word.length;
  for (let i = 0; i + L - tol <= hay.length; i++) {
    for (const len of [L - 1, L, L + 1]) {
      if (len <= 0 || i + len > hay.length) continue;
      if (lev(hay.slice(i, i + len), word) <= tol) return true;
    }
  }
  return false;
}
function keyHit(tokens, glued, word) {
  return tokens.some(t => tokenMatches(t, word)) || fuzzyIn(glued, word, Math.max(tolFor(word), word.length >= 8 ? 2 : 0));
}
// OCR often misreads 0/O, 1/l, 5/S in years. Normalize before matching.
function findVintage(tokens) {
  for (const t of tokens) {
    if (t.length !== 4) continue;
    const fixed = t.replace(/o/g, "0").replace(/[il|]/g, "1");
    if (/^(19|20)\d\d$/.test(fixed)) { const y = +fixed; if (y >= 1990 && y <= 2030) return y; }
  }
  return null;
}
function latestVintage(w) { return Math.max(...Object.keys(w.scores).map(Number)); }

// Returns {producer, wine, vintage, latest} or null.
function identify(text, strict) {
  const tokens = norm(text).split(" ").filter(Boolean);
  const glued = tokens.join("");
  const vintage = findVintage(tokens);
  let best = null;
  for (const p of CATALOG) {
    const byKey = p.keys.some(k => keyHit(tokens, glued, k));
    const hintCount = (p.hints || []).filter(h => fuzzyIn(glued, h, tolFor(h))).length;
    if (!byKey && hintCount < 2) continue;
    let wine = null;
    for (const w of p.wines) if (w.keys.length && w.keys.some(k => keyHit(tokens, glued, k))) { wine = w; break; }
    if (!wine) wine = p.wines.find(w => !w.keys.length) || null;
    if (!wine) continue;
    if (strict && !vintage) continue;
    const r = { producer: p, wine, vintage, latest: latestVintage(wine), score: wine.scores[latestVintage(wine)] };
    if (vintage) r.scanned = wine.scores[vintage] || null;
    if (!best || (byKey && !best.byKey)) best = Object.assign(r, { byKey });
  }
  return best;
}
function pathOf(r) { return `${r.producer.country} > ${r.producer.region} > ${r.producer.producer} > ${r.wine.name}`; }

// ---------- Camera and OCR ----------
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const debugEl = document.getElementById("debug");
const gate = document.getElementById("gate");
const gateMsg = document.getElementById("gateMsg");
const work = document.createElement("canvas");
const wctx = work.getContext("2d", { willReadFrequently: true });

let mode = "list", frozen = false, busy = false, worker = null, raf = 0;
let results = [];      // [{r, box}] from the last scan
let currentResult = null, badgeRects = [], sheetOpen = false;
let lastResult = { until: 0 };
const CROP = 0.10;     // skip top/bottom band of the frame (covered by UI)

function setStatus(t, live) { statusEl.textContent = t; statusEl.classList.toggle("live", !!live); }

async function initOCR() {
  setStatus("Loading text engine…");
  worker = await Tesseract.createWorker("eng", 1, {
    logger: m => { if (m.status === "loading tesseract core" || m.status === "loading language traineddata") setStatus(`Loading ${Math.round((m.progress||0)*100)}%`); }
  });
  await applyMode();
  setStatus("Ready. Frame the list and tap Scan.", true);
  scanBtn.disabled = false;
}
async function applyMode() {
  if (!worker) return;
  await worker.setParameters({
    tessedit_pageseg_mode: mode === "list" ? Tesseract.PSM.SINGLE_BLOCK : Tesseract.PSM.SPARSE_TEXT,
    preserve_interword_spaces: "1",
  });
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  const track = stream.getVideoTracks()[0];
  try { const caps = track.getCapabilities?.(); if (caps && caps.focusMode && caps.focusMode.includes("continuous")) await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch (e) {}
}

function sizeOverlay() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  overlay.width = Math.round(overlay.clientWidth * dpr);
  overlay.height = Math.round(overlay.clientHeight * dpr);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawOverlay();
}
window.addEventListener("resize", sizeOverlay);

// Map from work-canvas coords to displayed (object-fit: cover) coords.
function coverMap() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const k = vw / work.width;
  const cy = vh * CROP;
  return (x, y) => [ox + x * k * s, oy + (y * k + cy) * s];
}

// ---------- Scan: freeze frame, read once, place badges ----------
const scanBtn = document.getElementById("scan");
async function scan() {
  if (busy || !worker || !video.videoWidth) return;
  busy = true; scanBtn.disabled = true; scanBtn.textContent = "Reading…";
  results = []; badgeRects = []; resultEl.classList.remove("show");
  try {
    // Freeze: pausing the video keeps the last frame on screen.
    const target = 1100;
    const k = Math.min(1, target / video.videoWidth);
    const bandTop = Math.round(video.videoHeight * CROP), bandH = Math.round(video.videoHeight * (1 - 2 * CROP));
    work.width = Math.round(video.videoWidth * k);
    work.height = Math.round(bandH * k);
    wctx.drawImage(video, 0, bandTop, video.videoWidth, bandH, 0, 0, work.width, work.height);
    video.pause(); frozen = true;
    wctx.filter = "contrast(1.25) grayscale(1)"; wctx.drawImage(work, 0, 0); wctx.filter = "none";

    const t0 = performance.now();
    const { data } = await worker.recognize(work, {}, { text: true, blocks: true });
    const ms = Math.round(performance.now() - t0);
    const lines = [];
    for (const b of data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) {
      if (l.text && l.text.trim().length >= 3) lines.push({ text: l.text.trim(), bbox: l.bbox, conf: l.confidence });
    }
    debugEl.textContent = `${ms} ms\n` + lines.map(l => `${Math.round(l.conf)}  ${l.text}`).join("\n");

    if (mode === "list") {
      for (const l of lines) { const r = identify(l.text, false); if (r) results.push({ r, box: l.bbox }); }
      // One badge per text row: merge entries whose rows overlap, keep the first.
      results.sort((a, b) => a.box.y0 - b.box.y0);
      results = results.filter((it, i) => {
        if (!i) return true; const p = results[i - 1];
        return Math.min(p.box.y1, it.box.y1) - Math.max(p.box.y0, it.box.y0) <= 0.5 * Math.min(p.box.y1 - p.box.y0, it.box.y1 - it.box.y0);
      });
      currentResult = results.length ? results[0].r : null; // card is only used in label mode
      setStatus(results.length ? `${results.length} wine${results.length > 1 ? "s" : ""} found · ${ms} ms` : `No match · ${ms} ms`, true);
    } else {
      const r = identify(data.text || "", false);
      if (r) showResult(r);
      setStatus(r ? `Match · ${ms} ms` : `No match · ${ms} ms`, true);
    }
  } catch (e) {
    setStatus("Read failed: " + (e.message || e));
  } finally {
    busy = false; scanBtn.disabled = false; scanBtn.textContent = "Back to live";
    drawOverlay();
  }
}
function unfreeze() {
  frozen = false; results = []; badgeRects = []; currentResult = null;
  resultEl.classList.remove("show"); video.play();
  scanBtn.textContent = "Scan"; setStatus("Live. Tap Scan.", true);
  drawOverlay();
}

function showResult(r) {
  currentResult = r;
  document.getElementById("rScore").textContent = r.score + "p";
  document.getElementById("rLatest").textContent = `(${r.latest})`;
  document.getElementById("rName").textContent = pathOf(r);
  document.getElementById("rNote").textContent = "";
  resultEl.classList.add("show");
}

function drawOverlay() {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  octx.clearRect(0, 0, W, H);
  badgeRects = [];
  if (!frozen || mode !== "list" || !video.videoWidth || !work.width || !results.length) return;
  const map = coverMap();
  const rows = results.map(it => {
    const [x0, y0] = map(it.box.x0, it.box.y0), [x1, y1] = map(it.box.x1, it.box.y1);
    return { r: it.r, x0, y0, x1, y1 };
  }).filter(it => it.y1 > 0 && it.y0 < H);

  // Right column, pushed down so badges never overlap.
  const PAD = 8, GAP = 6, BW = Math.min(200, W * 0.52), BH = 46;
  let lastBottom = -Infinity;
  for (const it of rows) {
    const r = it.r;
    const bx = W - BW - PAD;
    let by = (it.y0 + it.y1) / 2 - BH / 2;
    if (by < lastBottom + GAP) by = lastBottom + GAP;
    lastBottom = by + BH;
    badgeRects.push({ x: bx, y: by, w: BW, h: BH, r });

    octx.strokeStyle = "rgba(246,239,232,.9)"; octx.lineWidth = 1.5;
    octx.beginPath(); octx.moveTo(it.x0, it.y1 + 3); octx.lineTo(Math.min(it.x1, bx - 6), it.y1 + 3); octx.stroke();
    octx.strokeStyle = "rgba(246,239,232,.5)";
    octx.beginPath(); octx.moveTo(Math.min(it.x1, bx - 6), it.y1 + 3); octx.lineTo(bx, by + BH / 2); octx.stroke();

    octx.fillStyle = "#f6efe8"; roundRect(bx, by, BW, BH, 9); octx.fill();
    octx.fillStyle = "#2a0f14"; octx.textBaseline = "alphabetic";
    octx.font = "700 18px Fraunces, Georgia, serif";
    octx.fillText(fit("Parker " + r.score + "p (" + r.latest + ")", BW - 20), bx + 10, by + 20);
    octx.fillStyle = "#5a3a40"; octx.font = "500 11.5px 'Inter Tight', system-ui, sans-serif";
    octx.fillText(fit(`${r.producer.producer} · ${r.wine.name}`, BW - 20), bx + 10, by + 36);
  }
}
function fit(text, maxW) {
  if (octx.measureText(text).width <= maxW) return text;
  while (text.length > 3 && octx.measureText(text + "…").width > maxW) text = text.slice(0, -1);
  return text + "…";
}
function roundRect(x, y, w, h, r) {
  octx.beginPath(); octx.moveTo(x + r, y); octx.arcTo(x + w, y, x + w, y + h, r); octx.arcTo(x + w, y + h, x, y + h, r);
  octx.arcTo(x, y + h, x, y, r); octx.arcTo(x, y, x + w, y, r); octx.closePath();
}

// ---------- Detail sheet ----------
function openSheet(r) {
  if (!r) return;
  document.getElementById("sPath").textContent = `${r.producer.country} > ${r.producer.region} > ${r.producer.producer}`;
  document.getElementById("sName").textContent = r.wine.name;
  document.getElementById("sScore").textContent = r.score + "p";
  document.getElementById("sLatest").textContent = `${r.latest} vintage`;
  document.getElementById("sGrapes").textContent = r.wine.grapes || "–";
  document.getElementById("sStyle").textContent = r.wine.style || "–";
  document.getElementById("sNotes").textContent = r.wine.notes || "";
  const vs = Object.keys(r.wine.scores).map(Number).sort((a, b) => b - a);
  document.getElementById("sVintages").innerHTML = vs.map(v => `<div class="vint"><span>${v}</span><b>Parker ${r.wine.scores[v]}p</b></div>`).join("");
  sheetOpen = true;
  document.getElementById("sheetBg").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function closeSheet() {
  sheetOpen = false;
  document.getElementById("sheetBg").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
}
overlay.addEventListener("click", e => {
  const rect = overlay.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const hit = badgeRects.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (hit) openSheet(hit.r);
  else if (frozen && !busy) unfreeze(); // tap the frozen image to go back to live
});
resultEl.addEventListener("click", () => openSheet(currentResult));
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.getElementById("sheetBg").addEventListener("click", closeSheet);
// swipe down to close
let touchY = null;
document.getElementById("sheet").addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive: true });
document.getElementById("sheet").addEventListener("touchend", e => { if (touchY !== null && e.changedTouches[0].clientY - touchY > 70 && document.getElementById("sheet").scrollTop === 0) closeSheet(); touchY = null; }, { passive: true });

// ---------- UI ----------
document.getElementById("start").addEventListener("click", async () => {
  gateMsg.textContent = "";
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("Camera API not available. Open this page in Safari over https.");
    await startCamera();
    gate.style.display = "none";
    sizeOverlay();
    scanBtn.disabled = true;
    await initOCR();
  } catch (e) {
    gateMsg.className = "err";
    gateMsg.textContent = "Could not start: " + (e.message || e) + ". Check camera permission for this site in Settings > Safari.";
  }
});
document.getElementById("modeList").addEventListener("click", () => setMode("list"));
document.getElementById("modeLabel").addEventListener("click", () => setMode("label"));
async function setMode(m) {
  mode = m; if (frozen) unfreeze();
  document.getElementById("modeList").setAttribute("aria-pressed", m === "list");
  document.getElementById("modeLabel").setAttribute("aria-pressed", m === "label");
  await applyMode();
}
scanBtn.addEventListener("click", () => { if (frozen && !busy) unfreeze(); else scan(); });
document.getElementById("dbg").addEventListener("click", () => debugEl.classList.toggle("show"));
</script>
